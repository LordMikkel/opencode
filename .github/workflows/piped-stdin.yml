name: piped-stdin

on:
  push:
    branches: [tui-piped-stdin-ci]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            expect: works
          - os: macos-latest
            expect: works
          # The fix is skipped on Windows, so it must behave exactly like before.
          - os: windows-latest
            expect: broken
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - uses: ./.github/actions/setup-bun

      - name: Install pywinpty
        if: runner.os == 'Windows'
        run: python -m pip install pywinpty

      - name: With fix
        shell: bash
        run: python .github/piped-stdin/check.py ${{ matrix.expect }}

      - name: Without fix
        if: always()
        shell: bash
        run: |
          git checkout c380815026~1 -- packages/cli/src/commands/handlers/default.ts packages/tui/src/app.tsx packages/tui/src/editor.ts
          python .github/piped-stdin/check.py broken
